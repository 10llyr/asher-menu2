<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أشار | ASHAR — المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@1,600;1,700&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e4d6b7;
    --ink:#2b1210;
    --burgundy:#8a4554;
    --burgundy-2:#6e3543;
    --taupe:#9d8273;
    --gold:#c8963d;
    --dim:#7a5f4a;
    --divider: rgba(138,69,84,.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ overflow-x:hidden; width:100%; }
  body{
    background: var(--bg);
    color:var(--ink);
    font-family:'Cairo', sans-serif;
    overflow-x:hidden;
    width:100%;
    max-width:100vw;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ---------- welcome line + top/bottom banner images ---------- */
  .welcome-line{
    text-align:center;
    font-family:'Cairo', sans-serif;
    font-size:1.15rem;
    font-weight:600;
    color:var(--ink);
    padding:28px 20px 18px;
  }
  .banner-top, .banner-bottom{
    width:100%;
    display:block;
    position:relative;
  }
  .banner-top::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:14%;
    background:linear-gradient(180deg, transparent, var(--bg));
    pointer-events:none;
  }
  .banner-top img, .banner-bottom img{
    width:100%;
    height:auto;
    display:block;
  }
  .banner-welcome{
    position:absolute;
    top:30%;
    left:58%;
    transform:translate(-50%, -50%);
    font-family:'Jost', sans-serif;
    font-weight:500;
    letter-spacing:.08em;
    font-size:clamp(1rem, 3vw, 1.35rem);
    color:var(--burgundy);
    text-align:center;
    white-space:nowrap;
  }

  /* ---------- menu section ---------- */
  .menu-section{ padding:24px 20px 60px; }

  .toggle-wrap{ display:flex; justify-content:center; margin-bottom:36px; }
  .toggle{ display:inline-flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .toggle button{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:.88rem;
    padding:11px 22px;
    cursor:pointer;
    border-radius:2px;
    transition:all .25s ease;
  }
  .toggle button.outline{ background:transparent; border:1px solid var(--burgundy); color:var(--burgundy); }
  .toggle button.solid{ background:var(--burgundy); border:1px solid var(--burgundy); color:var(--bg); }
  .toggle button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .section-label{
    text-align:center;
    font-weight:700;
    font-size:1.1rem;
    color:var(--burgundy);
    margin: 0 0 24px;
  }

  .menu-list{ max-width:640px; margin:0 auto; padding:0 8px; }
  .item-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:16px 0;
    border-bottom:1px solid var(--divider);
    gap:16px;
  }
  .item-left{ min-width:0; }
  .item-name-ar{ font-weight:700; font-size:1.08rem; }
  .item-name-en{
    font-family:'Jost', sans-serif;
    font-size:.74rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--dim);
    margin-top:3px;
  }
  .item-right{ text-align:left; flex-shrink:0; }
  .item-price{ font-family:'Jost', sans-serif; font-weight:600; font-size:1.15rem; color:var(--burgundy); }
  .item-kcal{ font-size:.72rem; color:var(--dim); margin-top:3px; }

  footer{ text-align:center; margin-top:50px; color:var(--dim); font-size:.75rem; letter-spacing:.08em; }
  .footer-mark{ display:flex; justify-content:center; margin-bottom:6px; }
  .footer-mark img{ display:block; }
  .footer-copyright{ margin-top:10px; font-size:.68rem; opacity:.8; }
</style>
</head>

<script>
const hot = [
  {ar:"كابتشينو", en:"Cappuccino", price:15, kcal:"80–120"},
  {ar:"لاتيه", en:"Latte", price:16, kcal:"120–180"},
  {ar:"كورتادو", en:"Cortado", price:14, kcal:"50–80"},
  {ar:"فلات وايت", en:"Flat White", price:15, kcal:"100–150"},
  {ar:"سبانيش لاته حار", en:"Hot Spanish Latte", price:18, kcal:"200–300"},
  {ar:"شاي", en:"Tea", price:5, kcal:"0–5"},
  {ar:"امريكانو", en:"Americano", price:14, kcal:"5–15"},
  {ar:"اسبريسو", en:"Espresso", price:12, kcal:"3–5"},
  {ar:"ميكاتو", en:"Macchiato", price:13, kcal:"10–30"},
  {ar:"موكا", en:"Mocha", price:18, kcal:"250–400"},
  {ar:"V60 حار", en:"Hot V60", price:16, kcal:"5–10"},
  {ar:"قهوة اليوم حار", en:"Coffee of the Day", price:9, kcal:"5–10"},
  {ar:"أشار لاتيه", en:"ASHAR Latte", price:19, kcal:"180–280"}
];

const cold = [
  {ar:"اسبريسو فريدو", en:"Espresso Freddo", price:15, kcal:"5–20"},
  {ar:"آيس أمريكانو", en:"Iced Americano", price:14, kcal:"5–15"},
  {ar:"آيس لاتيه", en:"Iced Latte", price:16, kcal:"120–180"},
  {ar:"آيس سبانيش لاتيه", en:"Iced Spanish Latte", price:19, kcal:"200–350"},
  {ar:"آيس وايت موكا", en:"Iced White Mocha", price:19, kcal:"250–450"},
  {ar:"آيس V60", en:"Iced V60", price:16, kcal:"5–10"},
  {ar:"قهوة اليوم بارد", en:"Coffee of the Day", price:9, kcal:"5–10"},
  {ar:"آيس كركديه", en:"Iced Hibiscus", price:9, kcal:"20–80"},
  {ar:"آيس ماتشا", en:"Iced Matcha", price:21, kcal:"150–250"},
  {ar:"آيس سجنتشر لاتيه", en:"Iced Signature Latte", price:21, kcal:"180–300"}
];

const list = document.getElementById('list');
const label = document.getElementById('section-label');
const btnHot = document.getElementById('btn-hot');
const btnCold = document.getElementById('btn-cold');

function render(items){
  list.innerHTML = items.map(d => `
    <div class="item-row">
      <div class="item-left">
        <div class="item-name-ar">${d.ar}</div>
        <div class="item-name-en">${d.en}</div>
      </div>
      <div class="item-right">
        <div class="item-price">${d.price}</div>
        <div class="item-kcal">${d.kcal} سعرة</div>
      </div>
    </div>
  `).join('');
}

function showHot(){
  btnHot.classList.remove('outline'); btnHot.classList.add('solid');
  btnCold.classList.remove('solid'); btnCold.classList.add('outline');
  label.textContent = 'المشروبات الساخنة';
  render(hot);
}
function showCold(){
  btnCold.classList.remove('outline'); btnCold.classList.add('solid');
  btnHot.classList.remove('solid'); btnHot.classList.add('outline');
  label.textContent = 'المشروبات الباردة';
  render(cold);
}

btnHot.addEventListener('click', showHot);
btnCold.addEventListener('click', showCold);
showHot();
</script>
